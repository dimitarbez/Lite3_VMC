topics:
  input: /emotion_bot/input
  state: /emotion_bot/state
  response: /emotion_bot/response
  chat_input: /emotion_bot/chat/input
  chat_cancel: /emotion_bot/chat/cancel
  chat_events: /emotion_bot/chat/events
  chat_response: /emotion_bot/chat/response
  conversation_events: /emotion_bot/conversation/events
  expression_cmd: /emotion_bot/expression_cmd
  expression_action: /emotion_bot/expression_action
  safe_cmd: /emotion_bot/safe_cmd
  manual_joy: /emotion_bot/manual_joy
  joy_output: /emotion_bot/joy_out
  status: /emotion_bot/status
  sim_ready: /emotion_bot/sim_controller_ready

services:
  set_motion_enabled: /emotion_bot/set_motion_enabled

runtime:
  emotion_bot_path: /workspaces/emotion-bot
  backend: deterministic
  personality: balanced
  seed: 7
  randomness_enabled: false
  heartbeat_rate: 2.0

chat:
  backend: deterministic
  model: gpt-5-mini
  bridge_endpoint: http://127.0.0.1:8765/v1/stream
  request_timeout: 20.0
  max_output_tokens: 300
  max_context_turns: 6
  max_context_chars: 6000
  max_input_chars: 2000
  max_response_chars: 6000
  max_retries: 1
  retry_delay: 0.25
  emotion_sync_timeout: 0.5
  offline_fallback: true

mapper:
  publish_rate: 20.0
  state_timeout: 1.0
  fluid:
    valence_tau: 0.45
    arousal_tau: 0.35
    blend_time: 0.14
    # Non-neutral emotion changes first cancel the old gesture and reach an
    # exact neutral pose for this short interval before the new entrance starts.
    neutral_return_time: 0.25
    # Hold the exact canonical stance long enough for Gazebo's physical body
    # and legs to settle before the next entrance begins. This prevents pose
    # residue from accumulating across several rapid emotion changes.
    neutral_hold_time: 0.35
    min_dwell: 0.12
    # Compatibility tuning key; same-category conversation appraisals now
    # adjust intensity without restarting the active loop.
    hysteresis: 0.06
    # Expressions are meant to read immediately in the close Gazebo view. Keep
    # conversational arousal as a modifier, but never shrink choreography into
    # a barely numerical pose change.
    min_intensity: 1.0
    # Final theatrical gain applied after interpolation. This deliberately
    # drives the enlarged simulation-only safety/controller envelope.
    amplitude_scale: 1.25
    # Entrances remain theatrical, while recurring body language settles into
    # a calmer rhythm instead of repeating the full-power pose on every beat.
    idle_amplitude_scale: 0.65
    idle_time_scale: 1.25
    max_linear_rate: 0.80
    max_yaw_rate: 3.50

safety:
  motion_enabled: false
  # Chat expressions stay centered inside a bounded Gazebo envelope. The bridge
  # smoothly recenters the dynamic model at the soft radius.
  allow_locomotion: true
  allow_dynamic_actions: true
  monitor_sim_health: false
  minimum_body_height: 0.10
  maximum_body_height: 0.50
  maximum_tilt: 1.20
  # Hard emergency boundary; normal roaming turns around much earlier.
  maximum_planar_displacement: 0.20
  home_return:
    enabled: true
    trigger_radius: 0.09
    resume_radius: 0.035
    # A short Gazebo-only correction keeps the model unfixed, but avoids the
    # upstream gait-entry lunge when recovering world position.
    maximum_step: 0.012
  health_timeout: 0.50
  prepare_stance_on_ready: false
  stance_settle_time: 4.0
  require_sim_ready: false
  publish_rate: 20.0
  # Allow a queued stance transition to complete before a one-shot action;
  # the input Twist watchdog remains 0.50 s.
  expression_timeout: 0.90
  # Actions stay eligible while the bridge performs the bounded gait-to-stance
  # sequence. Mapper staleness remains independent and emits an explicit cancel.
  action_queue_timeout: 4.0
  locomotion_zero_hold: 0.25
  manual_timeout: 0.50
  manual_priority_hold: 0.75
  mode_transition_delay: 0.35
  # The simulator's stand-to-advanced-trot submode switch takes 0.5 seconds.
  # Do not allow a new posture/action to interrupt that internal transition.
  gait_transition_guard: 0.60
  minimum_locomotion_time: 2.00
  manual_locomotion_timeout: 4.00
  # The controller's stand-to-emotion-trot handoff is 0.50 s; retain a small
  # settling margin before forwarding joy's bounded velocity.
  locomotion_command_delay: 0.65
  limits:
    linear_x: 0.10
    linear_y: 0.05
    angular_z: 0.10
    body_height: 0.100
    roll: 0.625
    pitch: 0.625
    linear_rate: 0.18
    yaw_rate: 0.30
    body_height_rate: 0.75
    attitude_rate: 5.00

mappings:
  neutral:
    intensity: 0.82
    duration: 1.0
    speed: 1.0
    acceleration: 0.80
    cooldown: 0.25
    variation: 0.0
    transition_blend: 0.14
    segments:
      - {duration: 0.25, z: 0.025, roll: 0.070, pitch: -0.055}
    idle_segments:
      - {duration: 0.55, z: 0.025, roll: 0.070, pitch: -0.055}
      - {duration: 0.55, z: -0.015, roll: -0.070, pitch: 0.045}
  joy:
    intensity: 1.0
    duration: 1.0
    speed: 1.0
    acceleration: 1.20
    cooldown: 0.35
    variation: 0.0
    transition_blend: 0.12
    segments:
      # Joy is energetic but centered: a full-height simulator hop followed by
      # big, fast body rocks. No unstable walking gait is selected.
      - {duration: 0.55, z: -0.055, action: hop}
      - {duration: 0.20, z: 0.080, roll: 0.480, pitch: -0.380}
      - {duration: 0.20, z: -0.060, roll: -0.480, pitch: 0.340}
      - {duration: 0.18, z: 0.075, roll: 0.440, pitch: -0.350}
    idle_segments:
